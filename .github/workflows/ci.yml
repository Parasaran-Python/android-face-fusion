name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrapper-validation:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

  python-check:
    name: Validate Python Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Verify Python Script Syntax
        run: python3 -m py_compile extract_emap.py

  lint:
    name: Android Lint Analysis
    needs: [wrapper-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AndroidFaceFusion-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          retention-days: 14

  unit-tests:
    name: Unit Tests Suite
    needs: [wrapper-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AndroidFaceFusion-unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  build:
    name: Build APKs, Bundles & Verify 16 KB Page Alignment
    needs: [lint, unit-tests, python-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK & App Bundle
        run: ./gradlew assembleDebug bundleDebug --no-daemon

      - name: Assemble Release APK & App Bundle (unsigned)
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify 16 KB Page Alignment Compliance
        run: |
          echo "Extracting native libraries to verify 16 KB page-size compliance..."
          mkdir -p /tmp/debug_extracted /tmp/release_extracted
          unzip -o app/build/outputs/apk/debug/app-debug.apk "lib/*" -d /tmp/debug_extracted
          unzip -o app/build/outputs/apk/release/app-release-unsigned.apk "lib/*" -d /tmp/release_extracted
          
          for so in $(find /tmp/debug_extracted /tmp/release_extracted -name "*.so"); do
            if [[ "$so" =~ (arm64-v8a|x86_64) ]]; then
              echo "Checking 64-bit native library: $so"
              non_aligned=$(readelf -W -l "$so" | awk '$1 == "LOAD" { align = $NF; if (align != "0x4000" && align != "0x10000" && align != "0x20000") print align }')
              if [ -n "$non_aligned" ]; then
                echo "::error file=$so::Found non-16KB aligned LOAD segments: $non_aligned"
                exit 1
              else
                echo "  ✓ All LOAD segments >= 16 KB (0x4000+) aligned."
              fi
            fi
          done
          echo "All 64-bit native libraries verified for 16 KB page alignment!"

      - name: Generate Build Summary
        run: |
          echo "### 🚀 CI Build & Artifact Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Type | File Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/bundle/debug/app-debug.aab app/build/outputs/bundle/release/app-release.aab; do
            if [ -f "$f" ]; then
              size=$(ls -lh "$f" | awk '{print $5}')
              echo "| \`$(basename $f)\` | $(basename $(dirname $f)) | $size |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **16 KB Page Alignment:** Verified on all 64-bit native libraries." >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AndroidFaceFusion-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AndroidFaceFusion-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Upload Release App Bundle Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AndroidFaceFusion-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
